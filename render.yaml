services:
  - type: web
    name: coding-test-platform-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    rootDir: backend
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # User must provide their MongoDB Connection String (e.g. from MongoDB Atlas)
      - key: JWT_SECRET
        generateValue: true # Generates a random secure key automatically
